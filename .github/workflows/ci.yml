name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The floor matches the `engines.node` range; Windows is covered
        # because path handling differs there and the CLI writes files.
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest]
        include:
          - node-version: 22.x
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Verify published package contents
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Catches the classic packaging mistakes — a missing dist/, a stray
      # source tree, or a tarball that ballooned — before they reach npm.
      - name: Pack and inspect
        run: |
          # --ignore-scripts: the build already ran above, and prepack would
          # write tsup output to stdout and corrupt the JSON.
          npm pack --dry-run --json --ignore-scripts > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [pkg] = JSON.parse(readFileSync('pack.json', 'utf8'));
            const names = pkg.files.map((f) => f.path);
            const required = ['dist/cli.js', 'dist/index.js', 'dist/index.d.ts', 'LICENSE'];
            const missing = required.filter((f) => !names.includes(f));
            if (missing.length) throw new Error('Missing from tarball: ' + missing.join(', '));
            const leaked = names.filter((f) => f.startsWith('src/') || f.startsWith('tests/'));
            if (leaked.length) throw new Error('Source leaked into tarball: ' + leaked.join(', '));
            console.log('Tarball OK:', names.length, 'files,', (pkg.size / 1024).toFixed(1), 'KB');
          "

      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
