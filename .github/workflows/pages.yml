name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; queued runs wait rather than clobbering each other.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      # The `playground` subcommand rather than `build`: this job only needs
      # the site, and `build` would also try to regenerate this repo's README.
      - name: Generate playground
        run: node dist/cli.js playground

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.devsetgo/playground'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
