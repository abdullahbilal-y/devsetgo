project:
  name: 'devsetgo'
  description: 'Interactive developer playground and documentation engine — converts source code, OpenAPI schemas, and Markdown into browser playgrounds and CRO-optimized docs.'
  repo: 'https://github.com/abdullahbilal-y/devsetgo'
  version: '1.0.0'

playground:
  theme: 'dark'
  title: 'devsetgo — Interactive Playground'
  languages:
    - 'javascript'
    - 'typescript'
  output_dir: '.devsetgo/playground'

readme:
  cro_enabled: true
  output: 'README.md'
  format: 'github'
  hero:
    tagline: 'Convert source code into interactive browser playgrounds and CRO-optimized docs — in one command.'
    badges:
      - type: 'build'
        status: 'passing'
      - type: 'version'
      - type: 'license'
      - type: 'downloads'
  problem: |
    Developer tool vendors and B2B software companies frequently struggle to convert GitHub repository visits into technical adoption:
    - README walls of text with no interactive execution or visual architecture maps
    - High onboarding friction requiring clone, install, and local build before evaluating anything
    - Zero conversion optimization — repos lack structured frameworks to turn visits into enterprise inquiries
  solution: |
    devsetgo solves this by compiling your code into WebAssembly browser modules and generating CRO-optimized documentation — all from a single CLI command.
  quick_start:
    install_command: 'npm install -g devsetgo'
    first_run: 'devsetgo init'
  features:
    - name: 'Code Parser'
      description: 'Extracts executable snippets via @playground annotations'
      status: 'stable'
    - name: 'OpenAPI Parser'
      description: 'Parses 3.x schemas into interactive API explorers'
      status: 'stable'
    - name: 'Markdown Parser'
      description: 'Splits docs into sections, detects executable code blocks'
      status: 'stable'
    - name: 'WASM Playground'
      description: 'Browser-side JS execution via QuickJS WebAssembly'
      status: 'stable'
    - name: 'API Explorer'
      description: 'Interactive request builder with auth and cURL export'
      status: 'stable'
    - name: 'CRO README'
      description: '10-section conversion-optimized README generation'
      status: 'stable'
    - name: 'Architecture Diagrams'
      description: 'Auto-generated Mermaid diagrams from code structure'
      status: 'stable'
    - name: 'Social Cards'
      description: 'Dark-mode OG/Twitter/GitHub cards with SVG/PNG output'
      status: 'stable'
    - name: 'Dev Server'
      description: 'Local preview with hot-reload'
      status: 'stable'
  metrics:
    - label: 'Playground Load'
      value: '< 2s'
    - label: 'README Generation'
      value: '< 500ms'
    - label: 'Asset Generation'
      value: '< 3s'

cta:
  install:
    command: 'npm install -g devsetgo'
    label: 'Get Started in 30 Seconds'
  enterprise:
    enabled: true
    url: 'https://calendly.com/devsetgo/discovery'
    label: 'Book Enterprise Demo'
    description: 'Custom documentation portals, DX audits, and DevRel growth strategies.'

assets:
  output_dir: 'assets'
  diagrams:
    enabled: true
    format: 'all'
    auto_detect: true
  social_cards:
    enabled: true
    theme: 'dark'
    sizes:
      - name: 'og'
        width: 1200
        height: 630
      - name: 'twitter'
        width: 1200
        height: 675
      - name: 'github'
        width: 800
        height: 400
