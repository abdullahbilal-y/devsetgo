project:
  name: 'devsetgo'
  description: 'Generates a runnable browser playground and architecture diagrams from your annotated source code.'
  repo: 'https://github.com/abdullahbilal-y/devsetgo'
  version: '2.0.0'

playground:
  theme: 'dark'
  title: 'devsetgo — Interactive Playground'
  languages:
    - 'javascript'
    - 'typescript'
  output_dir: '.devsetgo/playground'

readme:
  cro_enabled: true
  output: 'docs/example-generated-readme.md'
  format: 'github'
  hero:
    tagline: 'Turn annotated source code into a runnable browser playground and architecture diagrams.'
    badges:
      - type: 'build'
        status: 'passing'
      - type: 'version'
      - type: 'license'
      - type: 'downloads'
  problem: |
    Two parts of a project's documentation go stale the moment anyone merges a pull request:
    - Architecture diagrams drawn by hand, which quietly stop matching the real module structure
    - Code examples pasted into Markdown, which nobody re-runs and which drift from the working code
  solution: |
    devsetgo reads your source files directly, so both stay correct. It draws the architecture diagram from the imports it actually finds, and turns functions you tag with a comment into examples a reader can edit and run in the browser.
  quick_start:
    install_command: 'npm install -g devsetgo'
    first_run: 'devsetgo init'
  features:
    - name: 'Code Parser'
      description: 'Finds functions you tagged with a @playground comment'
      status: 'stable'
    - name: 'OpenAPI Parser'
      description: 'Reads an OpenAPI file and builds a request tester'
      status: 'stable'
    - name: 'Markdown Parser'
      description: 'Splits Markdown into sections and finds code blocks'
      status: 'stable'
    - name: 'WASM Playground'
      description: 'Runs your examples in the browser, sandboxed'
      status: 'stable'
    - name: 'API Explorer'
      description: 'Send real API requests and copy them as cURL'
      status: 'stable'
    - name: 'README Generator'
      description: 'Fills a Markdown template from your config file'
      status: 'stable'
    - name: 'Architecture Diagrams'
      description: 'Mermaid diagrams drawn from your real imports'
      status: 'stable'
    - name: 'Social Cards'
      description: 'Link preview images for social media'
      status: 'stable'
    - name: 'Dev Server'
      description: 'Local server that reloads when you rebuild'
      status: 'stable'
  metrics:
    - label: 'Tests'
      value: '169'
    - label: 'Line Coverage'
      value: '80%'
    - label: 'Runtime Deps'
      value: '6'
    - label: 'Install Size'
      value: '736 KB'

cta:
  install:
    command: 'npm install -g devsetgo'
    label: 'Install'
  enterprise:
    enabled: false
    url: ''
    label: ''
    description: ''

assets:
  output_dir: 'assets'
  diagrams:
    enabled: true
    format: 'all'
    auto_detect: true
  social_cards:
    enabled: true
    theme: 'dark'
    sizes:
      - name: 'og'
        width: 1200
        height: 630
      - name: 'twitter'
        width: 1200
        height: 675
      - name: 'github'
        width: 800
        height: 400
