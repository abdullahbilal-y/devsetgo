openapi: "3.0.3"
info:
  title: "Pet Store API"
  version: "1.0.0"
  description: "A sample Pet Store API for testing devplay OpenAPI parsing."

servers:
  - url: https://api.petstore.example.com/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
      required:
        - id
        - name

security:
  - bearerAuth: []

paths:
  /pets:
    get:
      summary: "List all pets"
      description: "Returns a paginated list of all pets in the store."
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          description: "Maximum number of pets to return"
          schema:
            type: integer
            default: 20
          example: 10
        - name: status
          in: query
          required: false
          description: "Filter by pet status"
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: "A list of pets"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              example:
                - id: 1
                  name: "Buddy"
                  status: "available"
                - id: 2
                  name: "Max"
                  status: "pending"
    post:
      summary: "Create a pet"
      description: "Add a new pet to the store."
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
            example:
              name: "Luna"
              status: "available"
      responses:
        "201":
          description: "Pet created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{petId}:
    get:
      summary: "Get a pet by ID"
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: "The ID of the pet"
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "A single pet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: "Pet not found"

    delete:
      summary: "Delete a pet"
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Pet deleted"
